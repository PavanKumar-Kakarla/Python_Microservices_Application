services:

  postgres:
    image: postgres:16
    container_name: ecommerce-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - ecommerce-network

  auth-service:

    build:
      context: ./auth-service

    container_name: auth-service

    env_file:
      - ./auth-service/.env

    depends_on:
      - postgres

    ports:
      - "8000:8000"

    networks:
      - ecommerce-network

  user-service:

    build:
      context: ./user-service

    container_name: user-service

    env_file:
      - ./user-service/.env

    depends_on:
      - postgres
      - auth-service

    ports:
      - "8001:8001"

    networks:
      - ecommerce-network

  product-service:
    build: 
      context: ./product-service
      
    container_name: product-service

    env_file:
      - ./product-service/.env

    ports:
      - "8002:8002"

    depends_on:
      - postgres
      - auth-service

    networks:
      - ecommerce-network

  cart-service:
    build:
      context: ./cart-service
    
    container_name: cart-service

    env_file:
      - ./cart-service/.env

    ports:
      - "8003:8003"

    depends_on:
      - postgres
      - product-service
      - user-service
    
    networks:
      - ecommerce-network

  order-service:
    build:
      context: ./order-service

    container_name: order-service

    env_file:
      - ./order-service/.env

    ports:
      - "8004:8004"

    depends_on:
      - postgres
      - auth-service
      - user-service
      - product-service
      - cart-service
    
    networks:
      - ecommerce-network

  payment-service:
    build:
      context: ./payment-service

    container_name: payment-service

    env_file:
      - ./payment-service/.env
    
    ports:
      - "8005:8005"
    
    depends_on:
      - postgres
      - auth-service
      - user-service
      - order-service
    
    networks:
      - ecommerce-network

  api-gateway:

    build:
      context: ./api-gateway

    container_name: api-gateway

    env_file:
      - ./api-gateway/.env

    depends_on:
      - auth-service
      - user-service
      - product-service
      - cart-service
      - order-service
      - payment-service

    ports:
      - "8050:8050"

    networks:
      - ecommerce-network


volumes:

  postgres_data:


networks:

  ecommerce-network: