services:

  postgres:
    image: postgres:16
    container_name: ecommerce-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - ecommerce-network

  auth-service:

    build:
      context: ./auth-service

    container_name: auth-service

    env_file:
      - ./auth-service/.env

    depends_on:
      - postgres

    ports:
      - "8000:8000"

    networks:
      - ecommerce-network

  user-service:

    build:
      context: ./user-service

    container_name: user-service

    env_file:
      - ./user-service/.env

    depends_on:
      - postgres
      - auth-service

    ports:
      - "8001:8001"

    networks:
      - ecommerce-network

  api-gateway:

    build:
      context: ./api-gateway

    container_name: api-gateway

    env_file:
      - ./api-gateway/.env

    depends_on:
      - auth-service
      - user-service

    ports:
      - "8050:8050"

    networks:
      - ecommerce-network


volumes:

  postgres_data:


networks:

  ecommerce-network: